<!DOCTYPE html>
<html>
  <head>
    <title>Quest 3 Football VR</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <!-- Look-controls and movement for Quest -->
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>

    <script>
      // AI for Opponents
      AFRAME.registerComponent('player-ai', {
        schema: { speed: {default: 0.03} },
        tick: function () {
          const ball = document.querySelector('#football');
          const ballPos = ball.object3D.position;
          const playerPos = this.el.object3D.position;
          let direction = new THREE.Vector3().subVectors(ballPos, playerPos).normalize();
          this.el.object3D.position.x += direction.x * this.schema.speed;
          this.el.object3D.position.z += direction.z * this.schema.speed;
          this.el.object3D.lookAt(ballPos.x, 0, ballPos.z);
        }
      });

      // Fake physics for the ball
      AFRAME.registerComponent('fake-ball', {
        schema: {
          gravity: { default: -9.8 },
          restitution: { default: 0.6 },
          friction: { default: 0.25 },
          maxSpeed: { default: 12 },
          groundY: { default: 0 }
        },
        init: function () {
          this.velocity = new THREE.Vector3();
          const radiusAttr = this.el.getAttribute('radius');
          this.radius = radiusAttr ? parseFloat(radiusAttr) : 0.3;
        },
        tick: function (time, timeDelta) {
          const dt = Math.min(timeDelta / 1000, 0.05);
          if (!dt) return;

          // Gravity
          this.velocity.y += this.data.gravity * dt;

          // Integrate position
          const pos = this.el.object3D.position;
          pos.x += this.velocity.x * dt;
          pos.y += this.velocity.y * dt;
          pos.z += this.velocity.z * dt;

          // Ground collision and bounce
          const minY = this.data.groundY + this.radius;
          if (pos.y < minY) {
            pos.y = minY;
            if (this.velocity.y < 0) {
              this.velocity.y = -this.velocity.y * this.data.restitution;
            }

            // Friction while on ground
            const frictionScale = Math.max(0, 1 - this.data.friction * dt);
            this.velocity.x *= frictionScale;
            this.velocity.z *= frictionScale;

            // Stop tiny jitter
            if (Math.abs(this.velocity.y) < 0.05) this.velocity.y = 0;
          }

          // Clamp speed
          const speed = this.velocity.length();
          if (speed > this.data.maxSpeed) {
            this.velocity.multiplyScalar(this.data.maxSpeed / speed);
          }
        },
        kick: function (direction, strength, lift) {
          const kickVec = direction.clone().multiplyScalar(strength);
          kickVec.y += lift;
          this.velocity.add(kickVec);
        },
        reset: function (position) {
          this.velocity.set(0, 0, 0);
          this.el.object3D.position.copy(position);
        }
      });

      // Click/tap kick controls
      AFRAME.registerComponent('kick-on-click', {
        schema: {
          ball: { type: 'selector' },
          camera: { type: 'selector' },
          strength: { default: 6 },
          lift: { default: 2 },
          range: { default: 2.5 }
        },
        init: function () {
          this.onKick = this.onKick.bind(this);
          window.addEventListener('click', this.onKick);
          window.addEventListener('touchstart', this.onKick, { passive: true });
        },
        remove: function () {
          window.removeEventListener('click', this.onKick);
          window.removeEventListener('touchstart', this.onKick);
        },
        onKick: function () {
          if (!this.data.ball || !this.data.camera) return;
          const ballEl = this.data.ball;
          const ballComp = ballEl.components['fake-ball'];
          if (!ballComp) return;

          const ballPos = new THREE.Vector3();
          const camPos = new THREE.Vector3();
          ballEl.object3D.getWorldPosition(ballPos);
          this.data.camera.object3D.getWorldPosition(camPos);

          if (ballPos.distanceTo(camPos) > this.data.range) return;

          const forward = new THREE.Vector3(0, 0, -1);
          forward.applyQuaternion(this.data.camera.object3D.quaternion).normalize();
          ballComp.kick(forward, this.data.strength, this.data.lift);
        }
      });

      // Score Detection (manual trigger)
      AFRAME.registerComponent('goal-logic', {
        schema: {
          width: { default: 10 },
          height: { default: 5 },
          depth: { default: 1 }
        },
        init: function () {
          this.ball = document.querySelector('#football');
          this.goalPos = new THREE.Vector3();
          this.ballPos = new THREE.Vector3();
          this.scored = false;
        },
        tick: function () {
          if (!this.ball) return;
          this.el.object3D.getWorldPosition(this.goalPos);
          this.ball.object3D.getWorldPosition(this.ballPos);

          const halfW = this.data.width / 2;
          const halfD = this.data.depth / 2;

          const inX = Math.abs(this.ballPos.x - this.goalPos.x) <= halfW;
          const inY = this.ballPos.y >= this.goalPos.y && this.ballPos.y <= this.goalPos.y + this.data.height;
          const inZ = Math.abs(this.ballPos.z - this.goalPos.z) <= halfD;

          if (inX && inY && inZ && !this.scored) {
            this.scored = true;
            document.querySelectorAll('.fan').forEach(f => f.emit('score'));
            setTimeout(() => {
              const ballComp = this.ball.components['fake-ball'];
              if (ballComp) ballComp.reset(new THREE.Vector3(0, 2, 0));
              this.scored = false;
            }, 1000);
          }
        }
      });
    </script>
  </head>
  <body>
    <!-- we add 'contactMaterials' to make the ball bounce better off hands -->
    <a-scene kick-on-click="ball: #football; camera: #playerCamera">
      
      <a-assets>
        <img id="grass" src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@master/examples/textures/terrain/grasslight-big.jpg">
        <a-mixin id="fan-anim" animation__jump="property: position; dur: 250; startEvents: score; loop: 4; dir: alternate"></a-mixin>
      </a-assets>

      <!-- QUEST 3 PLAYER RIG -->
      <a-entity id="rig" movement-controls="fly: false; speed: 0.3" position="0 0 10">
        <a-camera id="playerCamera" look-controls position="0 1.6 0"></a-camera>
        
        <!-- Left Controller Interaction -->
        <a-entity laser-controls="hand: left" raycaster="objects: .interactable; far: 2">
            <a-sphere radius="0.15" visible="true" color="blue"></a-sphere>
        </a-entity>
        
        <!-- Right Controller Interaction -->
        <a-entity laser-controls="hand: right" raycaster="objects: .interactable; far: 2">
            <a-sphere radius="0.15" visible="true" color="red"></a-sphere>
        </a-entity>
      </a-entity>

      <!-- FIELD -->
      <a-plane rotation="-90 0 0" width="100" height="150" src="#grass" repeat="20 30"></a-plane>
      <a-sky color="#6EBAFF"></a-sky>

      <!-- THE BALL -->
      <a-sphere id="football" fake-ball
                position="0 2 0" radius="0.3" color="white" shadow></a-sphere>

      <!-- GOAL -->
      <a-entity position="0 0 -40" goal-logic>
         <a-box position="-5 2.5 0" width="0.3" height="5" color="white"></a-box>
         <a-box position="5 2.5 0" width="0.3" height="5" color="white"></a-box>
         <a-box position="0 5 0" width="10.3" height="0.3" color="white"></a-box>
        <!-- The trigger zone -->
        <a-box position="0 2.5 0" width="10" height="5" depth="1" 
           material="transparent: true; opacity: 0.2" color="yellow"></a-box>
      </a-entity>

      <!-- TEAMMATES & OPPONENTS -->
            <a-entity geometry="primitive: capsule" material="color: green" position="-5 0.8 -5"></a-entity>
            <a-entity geometry="primitive: capsule" material="color: red" position="3 0.8 -10" player-ai="speed: 0.03"></a-entity>

      <!-- CROWD -->
      <a-entity position="-20 1 0">
        <a-entity class="fan" mixin="fan-anim" geometry="primitive: cylinder; radius:0.3" position="0 0.5 -2" material="color: blue" animation__jump="to: 0 1.5 -2"></a-entity>
        <a-entity class="fan" mixin="fan-anim" geometry="primitive: cylinder; radius:0.3" position="0 0.5 2" material="color: orange" animation__jump="to: 0 1.5 2"></a-entity>
      </a-entity>

    </a-scene>
  </body>
</html>
